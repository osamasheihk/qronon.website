        <section class="contact-container">
            <div class="contact-left">
              <h2>Qronon</h2>
              <p>City and Guilds Building <br>Imperial College London<br> SW7 2AZ<br>London, UK</p>
              <p><strong>Email:</strong><br><a href="mailto:info.qronon@gmail.com">info.qronon@gmail.com</a></p>
            </div>
          
            <form class="contact-right" action="mailto:info.qronon@gmail.com" method="POST">
              <div class="form-row">
                <div class="form-group">
                  <label for="first">First name *</label>
                  <input type="text" id="first" name="first" required>
                </div>
                <div class="form-group">
                  <label for="last">Last name *</label>
                  <input type="text" id="last" name="last" required>
                </div>
              </div>
          
              <div class="form-row">
                <div class="form-group">
                  <label for="email">Email *</label>
                  <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                  <label for="phone">Phone</label>
                  <input type="tel" id="phone" name="phone">
                </div>
              </div>
          
              <div class="form-group">
                <label for="company">Company</label>
                <input type="text" id="company" name="company">
              </div>
          
              <div class="form-group">
                <label>Reason for contact *</label>
                <div class="radio-group">
                  <label><input type="radio" name="reason" required> General Enquiries</label>
                  <label><input type="radio" name="reason"> Qronon questions</label>
                  <label><input type="radio" name="reason"> Investment questions</label>
                  <label><input type="radio" name="reason"> Joining the team</label>
                </div>
              </div>
          
              <div class="form-group">
                <label for="message">How can we help? *</label>
                <textarea id="message" name="message" required></textarea>
              </div>
          
              <button type="submit" class="submit-btn">Submit</button>
            </form>
          </section>
          

        <footer>
